name: Apply dependency security upgrade

# One-shot remediation gate; serial contract runner + deterministic lockfile refresh.
on:
  push:
    branches:
      - fix/independent-audit-remediation-20260917
    paths:
      - '.github/workflows/apply-dependency-security-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-security-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/independent-audit-remediation-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ykt-helper/package-lock.json
          registry-url: 'https://registry.npmjs.org'
      - name: Refresh audited build dependency lockfile without force
        working-directory: ykt-helper
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact rollup@4.63.3 @rollup/plugin-terser@1.0.0 --no-audit --no-fund
          npm update --package-lock-only --ignore-scripts picomatch serialize-javascript --no-audit --no-fund
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Require no high-severity advisories
        working-directory: ykt-helper
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm audit --audit-level=high
      - name: Run complete regression and build contracts
        working-directory: ykt-helper
        run: |
          npm run test:all
          npm run build
          npm run test:build
      - name: Verify resolved dependency versions
        working-directory: ykt-helper
        shell: bash
        run: |
          set -euo pipefail
          npm ls rollup @rollup/plugin-terser picomatch serialize-javascript
      - name: Commit verified dependency update only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':(exclude)ykt-helper/package.json' ':(exclude)ykt-helper/package-lock.json'
          git add ykt-helper/package.json ykt-helper/package-lock.json
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: upgrade audited Rollup dependencies'
          git push origin HEAD:fix/independent-audit-remediation-20260917
