name: Publish Full Regression Field Test

on:
  push:
    branches:
      - audit/full-regression-20260917
    paths:
      - '.github/workflows/publish-full-regression-field-test.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ykt-helper/package-lock.json
      - name: Install locked dependencies
        working-directory: ykt-helper
        run: npm ci --no-audit --no-fund
      - name: Build userscript
        working-directory: ykt-helper
        run: npm run build
      - name: Verify built userscript contract
        working-directory: ykt-helper
        run: npm run test:build
      - name: Prepare 1.21.6.5 field-test artifact
        run: |
          set -euo pipefail
          target='release/ykt-helper-1216-full-regression-test.user.js'
          cp ykt-helper/dist/ykt-helper-1216.user.js "$target"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('release/ykt-helper-1216-full-regression-test.user.js')
          text = path.read_text(encoding='utf-8')
          old = '// @version      1.21.6'
          new = '// @version      1.21.6.5'
          if text.count(old) != 1:
              raise SystemExit(f'expected one version header, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -F '// @version      1.21.6.5' "$target"
          grep -F 'registerRuntimeActions' "$target"
          grep -F 'timeline-live' "$target"
          grep -F '网络请求超时' "$target"
      - name: Commit artifact and remove one-shot publisher
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/ykt-helper-1216-full-regression-test.user.js
          git rm .github/workflows/publish-full-regression-field-test.yml
          git commit -m 'release: publish 1.21.6.5 full-regression field test'
          git push origin HEAD:audit/full-regression-20260917
