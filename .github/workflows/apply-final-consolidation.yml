name: Apply Final Consolidation

on:
  push:
    branches:
      - audit/full-regression-20260917
    paths:
      - .github/workflows/apply-final-consolidation.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ykt-helper/package-lock.json
      - name: Apply deterministic consolidation patch
        run: python3 .github/scripts/apply-final-consolidation.py
      - name: Diff sanity
        run: |
          git diff --check
          git diff --stat
          git diff -- ykt-helper/src
      - name: Install locked dependencies
        working-directory: ykt-helper
        run: |
          npm ci --no-audit --no-fund || {
            npm cache verify || true
            npm ci --no-audit --no-fund
          }
      - name: Legacy regression
        working-directory: ykt-helper
        run: npm run test:legacy
      - name: Unit matrices and import graph
        working-directory: ykt-helper
        run: npm run test:unit
      - name: Browser and network contracts
        working-directory: ykt-helper
        run: npm run test:contract
      - name: Cross-module scenarios
        working-directory: ykt-helper
        run: npm run test:scenario
      - name: Build userscript
        working-directory: ykt-helper
        run: npm run build
      - name: Build contract
        working-directory: ykt-helper
        run: npm run test:build
      - name: Reject Rollup circular dependency warnings
        working-directory: ykt-helper
        run: |
          npm run build > /tmp/ykt-build.log 2>&1
          cat /tmp/ykt-build.log
          if grep -q "Circular dependencies" /tmp/ykt-build.log; then
            echo "Rollup still reports circular dependencies" >&2
            exit 1
          fi
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ykt-helper/src
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "refactor: unify runtime UI context and answer semantics"
          git push origin HEAD:audit/full-regression-20260917
