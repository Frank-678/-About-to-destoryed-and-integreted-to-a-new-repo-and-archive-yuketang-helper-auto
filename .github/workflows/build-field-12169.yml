name: Build 1.21.6.9 Final Field Userscript

on:
  push:
    branches:
      - fix/independent-audit-remediation-20260917
    paths:
      - '.github/workflows/build-field-12169.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/independent-audit-remediation-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ykt-helper/package-lock.json
      - name: Install
        working-directory: ykt-helper
        run: npm ci --no-audit --no-fund
      - name: Build and validate
        working-directory: ykt-helper
        run: |
          npm run build
          npm run test:build
      - name: Publish 1.21.6.9 field artifact
        run: |
          cp ykt-helper/dist/ykt-helper-1216.user.js release/ykt-helper-1216-field.user.js
          sed -i -E 's#^// @version[[:space:]]+1\.21\.6$#// @version      1.21.6.9#' release/ykt-helper-1216-field.user.js
          grep -q '^// @version[[:space:]]\+1\.21\.6\.9$' release/ykt-helper-1216-field.user.js
          node --check release/ykt-helper-1216-field.user.js
          grep -q 'GM_getValue' release/ykt-helper-1216-field.user.js
          grep -q 'html2canvas@1.4.1' release/ykt-helper-1216-field.user.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/ykt-helper-1216-field.user.js
          git commit -m 'build: publish 1.21.6.9 final field userscript'
          git push origin HEAD:fix/independent-audit-remediation-20260917
