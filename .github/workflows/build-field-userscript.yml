name: Build Field Userscript

on:
  push:
    branches:
      - fix/independent-audit-remediation-20260917
    paths:
      - '.github/workflows/build-field-userscript.yml'
      - 'ykt-helper/**'

permissions:
  contents: write

concurrency:
  group: field-userscript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/independent-audit-remediation-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ykt-helper/package-lock.json
      - name: Install
        working-directory: ykt-helper
        run: npm ci --no-audit --no-fund
      - name: Test and build
        working-directory: ykt-helper
        env:
          BUILD_VERSION: field-1.21.6.6
        run: |
          npm run test:all
          npm run build
          npm run test:build
      - name: Prepare field artifact
        run: |
          cp ykt-helper/dist/ykt-helper-1216.user.js release/ykt-helper-1216-field.user.js
          sed -i -E 's#^// @version[[:space:]]+1\.21\.6$#// @version      1.21.6.6#' release/ykt-helper-1216-field.user.js
          grep -q '^// @version[[:space:]]\+1\.21\.6\.6$' release/ykt-helper-1216-field.user.js
          grep -q '^// @grant[[:space:]]\+GM_getValue$' release/ykt-helper-1216-field.user.js
          grep -q '^// @grant[[:space:]]\+GM_setValue$' release/ykt-helper-1216-field.user.js
          grep -q '^// @grant[[:space:]]\+GM_deleteValue$' release/ykt-helper-1216-field.user.js
          node --check release/ykt-helper-1216-field.user.js
      - name: Commit field artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/ykt-helper-1216-field.user.js
          if git diff --cached --quiet; then
            echo 'Field artifact unchanged'
            exit 0
          fi
          git commit -m 'build: publish 1.21.6.6 field userscript'
          git push origin HEAD:fix/independent-audit-remediation-20260917
