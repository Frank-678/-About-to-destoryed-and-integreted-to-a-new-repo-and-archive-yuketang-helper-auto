name: Remediation Validation

on:
  push:
    branches:
      - fix/independent-audit-remediation-20260917
    paths:
      - 'ykt-helper/**'
      - '.github/workflows/remediation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remediation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fault-injection:
    name: Independent fault injection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ykt-helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/audit/*.audit.test.mjs

  regression:
    name: Full project regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ykt-helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ykt-helper/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:all
      - run: npm run build
      - run: npm run test:build

  architecture-boundary:
    name: Network/state architecture boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ykt-helper
    steps:
      - uses: actions/checkout@v4
      - name: Reject direct interceptor-to-actions coupling
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn "from ['\"]\.\./state/actions\.js['\"]" src/net; then
            echo 'Network interceptors must dispatch through runtime-dispatch, not import actions directly.' >&2
            exit 1
          fi

  dependency-audit:
    name: High severity dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ykt-helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
